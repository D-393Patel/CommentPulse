services:
  - type: web
    name: commentpulse-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install --no-cache-dir -r requirements-render.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 app:app
    healthCheckPath: /readyz
    autoDeployTrigger: 'off'
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: ASYNC_WORKER_COUNT
        value: "1"
      - key: MAX_COMMENTS_PER_REQUEST
        value: "100"
      - key: JOB_TTL_SECONDS
        value: "1800"
